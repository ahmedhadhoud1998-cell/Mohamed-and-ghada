<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed &amp; Ghada | Wedding Invitation</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Alex+Brush&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment: #F5EFE6;
            --kraft-card: #FAF6F0;
            --bark-brown: #3E3229;
            --warm-taupe: #6D5D50;
            --sage-green: #586B53;
            --sage-light: #DCE3D8;
            --terracotta: #B5694D;
            --border-wood: #D5C7B6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--parchment);
            background-image: radial-gradient(#DFD5C7 0.75px, transparent 0.75px);
            background-size: 18px 18px;
            color: var(--bark-brown);
            font-family: 'Nunito Sans', sans-serif;
            line-height: 1.7;
            text-align: center;
            overflow-x: hidden;
        }

        /* Arabic Typography Overrides */
        html[lang="ar"] body {
            font-family: 'Cairo', sans-serif;
        }

        html[lang="ar"] .serif,
        html[lang="ar"] h1,
        html[lang="ar"] h2,
        html[lang="ar"] h3 {
            font-family: 'Amiri', serif;
        }

        html[lang="ar"] .script {
            font-family: 'Amiri', serif;
            font-weight: 700;
        }

        h1, h2, h3, .serif {
            font-family: 'Lora', serif;
            font-weight: 500;
        }

        .script {
            font-family: 'Alex Brush', cursive;
            font-weight: 400;
        }

        /* Full-Screen Rustic Cover Overlay */
        #cover-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(rgba(36, 28, 22, 0.58), rgba(36, 28, 22, 0.72)),
                        url('https://unsplash.com') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #FAF6F0;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        #cover-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .cover-frame {
            border: 1px solid rgba(250, 246, 240, 0.45);
            outline: 1px solid rgba(250, 246, 240, 0.25);
            outline-offset: -8px;
            padding: 45px 28px;
            max-width: 520px;
            width: 100%;
            background: rgba(44, 34, 27, 0.35);
            backdrop-filter: blur(4px);
            border-radius: 6px;
        }

        .cover-tag {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.75rem;
            color: #E6D7C3;
            margin-bottom: 12px;
        }

        .cover-names {
            font-family: 'Alex Brush', cursive;
            font-size: clamp(3.4rem, 10vw, 5rem);
            line-height: 1.1;
            color: #FFFFFF;
            margin: 10px 0;
        }

        .cover-date {
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #F2E8DC;
            margin-bottom: 28px;
        }

        .cover-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cover-btn {
            padding: 13px 26px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
            min-width: 155px;
        }

        .cover-btn-en {
            background-color: var(--sage-green);
            color: #FFFFFF;
            border: 1px solid var(--sage-green);
            font-family: 'Nunito Sans', sans-serif;
            text-transform: uppercase;
        }

        .cover-btn-ar {
            background-color: var(--terracotta);
            color: #FFFFFF;
            border: 1px solid var(--terracotta);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
        }

        .cover-btn:hover {
            transform: translateY(-2px);
            opacity: 0.94;
        }

        /* Floating Language Toggle Bar */
        .lang-bar {
            display: flex;
            justify-content: flex-end;
            max-width: 720px;
            margin: 14px auto 0;
            padding: 0 20px;
        }

        .lang-toggle {
            background: var(--kraft-card);
            border: 1px solid var(--border-wood);
            color: var(--bark-brown);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .lang-toggle:hover {
            border-color: var(--sage-green);
            color: var(--sage-green);
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Hero Section */
        .hero {
            min-height: 88vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--kraft-card);
            border: 2px solid var(--border-wood);
            outline: 1px solid var(--sage-green);
            outline-offset: -10px;
            margin: 16px auto 20px;
            max-width: 680px;
            padding: 46px 24px;
            position: relative;
            box-shadow: 0 12px 35px rgba(62, 50, 41, 0.06);
        }

        .botanical-icon {
            width: 54px;
            height: 54px;
            margin-bottom: 14px;
        }

        .subtitle {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--sage-green);
            margin-bottom: 14px;
        }

        html[lang="ar"] .subtitle {
            letter-spacing: 0;
            font-size: 0.95rem;
        }

        .names {
            font-size: clamp(3.5rem, 9vw, 5.5rem);
            line-height: 1.1;
            color: var(--bark-brown);
            margin: 8px 0;
        }

        .ampersand {
            font-family: 'Lora', serif;
            font-style: italic;
            color: var(--terracotta);
            font-size: clamp(2rem, 5vw, 2.8rem);
            display: block;
            margin: 4px 0;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 24px auto;
            width: 180px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: var(--border-wood);
        }

        .divider-dot {
            width: 7px;
            height: 7px;
            background-color: var(--sage-green);
            border-radius: 50%;
        }

        .date-banner {
            font-size: 1.35rem;
            letter-spacing: 1px;
            color: var(--bark-brown);
            margin-bottom: 6px;
        }

        .venue-banner {
            font-size: 1.05rem;
            color: var(--warm-taupe);
            font-style: italic;
            font-family: 'Lora', serif;
        }

        html[lang="ar"] .venue-banner {
            font-style: normal;
            font-family: 'Cairo', sans-serif;
        }

        /* Countdown */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 32px;
            flex-wrap: wrap;
            direction: ltr;
        }

        .time-box {
            background: var(--parchment);
            border: 1px dashed var(--sage-green);
            padding: 13px 15px;
            min-width: 72px;
            border-radius: 6px;
        }

        .time-box span {
            display: block;
            font-family: 'Lora', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--terracotta);
            line-height: 1.1;
        }

        .time-box small {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--warm-taupe);
            font-weight: 600;
        }

        /* Sections */
        section {
            padding: 50px 20px;
        }

        .section-title {
            font-size: 2.25rem;
            color: var(--bark-brown);
            margin-bottom: 12px;
        }

        .details-card {
            background: var(--kraft-card);
            border: 1px solid var(--border-wood);
            padding: 38px 24px;
            border-radius: 8px;
            margin-top: 24px;
            box-shadow: 0 8px 24px rgba(62, 50, 41, 0.04);
        }

        .detail-item {
            margin-bottom: 20px;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            text-transform: uppercase;
            font-size: 0.74rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--sage-green);
